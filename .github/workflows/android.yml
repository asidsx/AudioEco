name: Build & Release Android (.apk)

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*'
      - '*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Configure Android Project
        run: |
          python3 -c "
          import os

          # Update variables.gradle to modern Android SDK
          if os.path.exists('android/variables.gradle'):
              with open('android/variables.gradle', 'r') as f:
                  content = f.read()
              content = content.replace('compileSdkVersion = 34', 'compileSdkVersion = 35')
              content = content.replace('targetSdkVersion = 34', 'targetSdkVersion = 35')
              with open('android/variables.gradle', 'w') as f:
                  f.write(content)

          # Update build.gradle application ID
          if os.path.exists('android/app/build.gradle'):
              with open('android/app/build.gradle', 'r') as f:
                  bg = f.read()
              bg = bg.replace('applicationId \"com.example.app\"', 'applicationId \"org.audioeco.app\"')
              with open('android/app/build.gradle', 'w') as f:
                  f.write(bg)

          # Ensure AndroidManifest.xml has correct flags
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m_content = f.read()
              m_content = m_content.replace('package=\"com.example.app\"', 'package=\"org.audioeco.app\"')
              if 'android:extractNativeLibs' not in m_content:
                  m_content = m_content.replace('<application', '<application\n        android:extractNativeLibs=\"true\"')
              with open(manifest_path, 'w') as f:
                  f.write(m_content)
          "

      - name: Build Android APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Sign and Align APKs with uber-apk-signer (v1 + v2 + v3 + v4 Schemes)
        run: |
          curl -L -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          mkdir -p release-apks

          # Find raw compiled APKs
          RAW_APKS=$(find android/app/build/outputs/apk -name "*.apk")
          echo "Found source APKs to sign:"
          echo "$RAW_APKS"

          for apk in $RAW_APKS; do
            java -jar uber-apk-signer.jar -a "$apk" --out release-apks --allowResign --verbose
          done

          cd release-apks

          # Select signed APK
          SIGNED_FILE=$(find . -maxdepth 1 -name "*-aligned-signed.apk" | head -n 1)
          if [ -z "$SIGNED_FILE" ]; then
            SIGNED_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          fi

          echo "Selected signed APK: $SIGNED_FILE"
          cp -f "$SIGNED_FILE" AudioECO.apk
          cp -f "$SIGNED_FILE" AudioECO-Signed.apk

          ls -la

      - name: Upload Signed APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            release-apks/AudioECO.apk
            release-apks/AudioECO-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (For Actions Runs)
        uses: actions/upload-artifact@v4
        with:
          name: AudioECO-Signed-APK
          path: release-apks/*.apk

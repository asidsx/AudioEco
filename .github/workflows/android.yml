name: Build and Sign Android APK

on:
  push:
    tags:
      - 'v*'
      - '*'
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK (v1, v2, v3, v4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --no-audit --prefer-offline || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Configure Java 17 Compatibility in Gradle
        run: |
          # Ensure Java 17 compatibility across Android modules
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/variables.gradle || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/app/build.gradle || true
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME" || ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias audioeco_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "audioeco_secure_pass" \
            -keypass "audioeco_secure_pass" \
            -dname "CN=AudioECO, OU=Mobile, O=AudioECO, L=Earth, ST=State, C=US"

      - name: Align and Sign APK with v1, v2, v3, and v4 Schemes
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          # Find generated APK
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found source APK to sign: $RAW_APK"

          # 1. 4-byte boundary alignment
          $BUILD_TOOLS_DIR/zipalign -v -f -p 4 "$RAW_APK" "AudioECO-aligned.apk"

          # 2. Sign with all Android signature schemes (v1, v2, v3, v4)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:audioeco_secure_pass \
            --key-pass pass:audioeco_secure_pass \
            --ks-key-alias audioeco_key \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "AudioECO.apk" \
            "AudioECO-aligned.apk"

          # 3. Verify signature
          echo "=== SIGNATURE VERIFICATION ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose "AudioECO.apk"
          echo "==============================="

          cp AudioECO.apk AudioECO-Signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioECO-Signed-APK
          path: |
            AudioECO.apk
            AudioECO-Signed.apk

      - name: Attach Signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioECO.apk
            AudioECO-Signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

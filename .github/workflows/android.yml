name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build React Web App
        run: npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Initialize Capacitor Android (if not present)
        run: |
          # Install Ionic/Capacitor dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Initialize capacitor config if not present
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "AudioECO" "com.audioeco.audiobookplayer" --web-dir=dist
          fi
          
          # Create Android native project directory if not exists
          if [ ! -d android ]; then
            npx cap add android
          fi
          
          # Sync Web code into the Android studio project scaffolding
          npx cap sync android

      - name: Patch Android Gradle Dependencies
        run: |
          echo -e "\nconfigurations.all {\n    resolutionStrategy {\n        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n    }\n}" >> android/app/build.gradle

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for Release
        if: github.event_name == 'release'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AudioECO.apk

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/AudioECO.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
